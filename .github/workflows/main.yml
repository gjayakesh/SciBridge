name: Deploy SciBridge to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site output
        run: |
          rm -rf site
          mkdir -p site
          rsync -av --exclude='.git' --exclude='.github' --exclude='.vscode' --exclude='node_modules' --exclude='**/*.yml' --exclude='**/*.yaml' ./ site/
          touch site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — SciBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="profile">

<div id="loader"><div class="loader-ring"></div><div class="lt">Establishing link…</div></div>
<div id="starfield"><canvas id="stars-canvas"></canvas></div>

<nav id="navbar"></nav>

<div id="app">
<section class="page">

  <div class="wrap section">
    <div class="profile-header reveal">
      <div class="avatar" id="profAvatar" style="width:84px;height:84px;font-size:26px;margin-left:0;background:var(--signal-dim);color:var(--signal);border:1px solid var(--line-hi)"></div>
      <div style="flex:1">
        <h1 id="profName" style="font-size:clamp(26px,3.6vw,38px);text-transform:uppercase"></h1>
        <p id="profMeta" style="color:var(--dim);font-size:13.5px;margin-top:4px"></p>
        <div id="profBadges" style="display:flex;gap:8px;margin-top:var(--s3);flex-wrap:wrap;align-items:center"></div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="toast('Editing is a demo action in this preview')">Edit Profile</button>
    </div>

    <div class="profile-grid">
      <div>
        <div class="card" style="padding:var(--s6);margin-bottom:var(--s5)">
          <h4 class="ws-label">About</h4>
          <p id="profBio" style="font-size:13.5px;color:var(--dim)"></p>
        </div>
        <div class="card" style="padding:var(--s6);margin-bottom:var(--s5)">
          <h4 class="ws-label">My Projects</h4>
          <div id="profProjects"></div>
        </div>
        <div class="card" style="padding:var(--s6)">
          <h4 class="ws-label">Achievements</h4>
          <div id="profAchievements" style="display:flex;gap:8px;flex-wrap:wrap"></div>
        </div>
      </div>
      <div>
        <div class="card" style="padding:var(--s5);margin-bottom:var(--s5)">
          <h4 class="ws-label">Education</h4>
          <div id="profEducation" style="font-size:13px;color:var(--dim);line-height:1.8"></div>
        </div>
        <div class="card" style="padding:var(--s5);margin-bottom:var(--s5)">
          <h4 class="ws-label">Skills</h4>
          <div id="profSkills" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--s4)"></div>
          <h4 class="ws-label">Interests</h4>
          <div id="profInterests" style="display:flex;flex-wrap:wrap;gap:6px"></div>
        </div>
        <div class="card" style="padding:var(--s5)">
          <h4 class="ws-label">Documents</h4>
          <div id="profDocs"></div>
        </div>
      </div>
    </div>
  </div>
</section>
</div>

<footer id="site-footer"></footer>
<div id="toast-container"></div>

<script src="js/shared.js"></script>
<script src="js/profile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Console — SciBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin-login">

<div id="loader"><div class="loader-ring"></div><div class="lt">Establishing link…</div></div>
<div id="starfield"><canvas id="stars-canvas"></canvas></div>

<nav id="navbar"></nav>

<div id="app">
<section class="page">

  <div class="wrap auth-shell">
    <div class="auth-card card" style="padding:var(--s7)">
      <div class="auth-head">
        <div class="eyebrow amber" style="justify-content:center">Restricted</div>
        <h2>Admin Console</h2>
        <p>Mission control access only.</p>
      </div>
      <form onsubmit="handleAdminLogin(event)">
        <div class="field"><label>Admin Email</label><input class="input" id="adminEmail" placeholder="admin@scibridge.space" required></div>
        <div class="field"><label>Admin Password</label><input class="input" type="password" id="adminPassword" placeholder="••••••••" required></div>
        <button class="btn btn-primary btn-block" type="submit">Enter Admin Console</button>
      </form>
      
    </div>
  </div>
</section>
</div>

<footer id="site-footer"></footer>
<div id="toast-container"></div>

<script src="js/shared.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
